version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: virtulab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: virtulab_user
      POSTGRES_PASSWORD: virtulab_secure_password_2026
      POSTGRES_DB: virtulabkenya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtulab_user -d virtulabkenya"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtulab_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://virtulab_user:virtulab_secure_password_2026@db:5432/virtulabkenya
      JWT_SECRET: virtulab_super_secret_jwt_key_ouk_msc_2026
      ADMIN_EMAIL: admin@virtulab.co.ke
      ADMIN_PASSWORD: VirtuLabAdmin2026!
      CORS_ORIGIN: "https://virtulab.co.ke,http://localhost:3000"

volumes:
  pgdata:
    driver: local
