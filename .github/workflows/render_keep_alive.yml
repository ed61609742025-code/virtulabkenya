name: Render Heartbeat Keep-Alive

on:
  schedule:
    # Run every 13 minutes to prevent Render free instance from spinning down (15m cutoff)
    - cron: '*/13 * * * *'
  workflow_dispatch: # Allows manual run directly from GitHub UI

jobs:
  heartbeat:
    name: Ping Render Instance
    runs-on: ubuntu-latest
    steps:
      - name: Ping VirtuLab Kenya Healthz Endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 20 https://virtulab-web.onrender.com/healthz || echo "000")
          echo "Render Healthz Response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "VirtuLab instance is warm, responsive, and healthy."
          else
            echo "Instance may be waking up or received status ($HTTP_STATUS)."
          fi
