<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration — VirtuLab Kenya</title>
<script>
  var t = localStorage.getItem('vlk_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800" rel="stylesheet">
<link rel="stylesheet" href="/shared/style.css">
<link rel="stylesheet" href="/shared/auth.css">
</head>
<body class="auth-page">

<!-- Theme Controls -->
<div class="theme-toggle-float" title="Switch appearance theme">
  <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">Dark</button>
  <button class="theme-btn" data-theme="light" onclick="setTheme('light')">Light</button>
  <button class="theme-btn" data-theme="green" onclick="setTheme('green')">Lab</button>
</div>

<!-- Student Register Box -->
<div class="auth-card">
  <div class="auth-header">
    <div class="vlk-brand-logo-wrap lg" style="margin: 0 auto 14px auto;">
      <img src="/shared/virtulab-logo.svg" alt="VirtuLab Kenya Logo" class="vlk-brand-logo-img" width="52" height="52">
    </div>
    <h1 class="auth-logo-title">VirtuLab Kenya</h1>
    <p class="auth-sub">Student Registration — Create an account to run chemistry practicals and track your progress.</p>
  </div>

  <div class="auth-form-group">
    <!-- Full Name -->
    <div>
      <label for="name" class="field-label">Full Name</label>
      <div class="input-wrapper">
        
        <input type="text" id="name" class="auth-input" placeholder="Full name">
      </div>
    </div>

    <!-- School Email Address -->
    <div>
      <label for="email" class="field-label">School Email Address</label>
      <div class="input-wrapper">
        
        <input type="email" id="email" class="auth-input" placeholder="student@school.ac.ke" autocomplete="email">
      </div>
    </div>

    <!-- Form / Class -->
    <div>
      <label for="form" class="field-label">Form / Class</label>
      <div class="input-wrapper">
        
        <select id="form" class="auth-select">
          <option value="">Select your Form / Class</option>
          <option value="Form 1">Form 1</option>
          <option value="Form 2">Form 2</option>
          <option value="Form 3">Form 3</option>
          <option value="Form 4">Form 4</option>
        </select>
      </div>
    </div>

    <!-- School Registration Code -->
    <div>
      <label for="schoolCode" class="field-label">School Registration Code</label>
      <div class="input-wrapper">
        
        <input type="text" id="schoolCode" class="auth-input" placeholder="e.g. SCH001" style="text-transform:uppercase;">
      </div>
    </div>

    <!-- Teacher Code (Optional) -->
    <div>
      <label for="teacherCode" class="field-label">Teacher Code <span style="font-weight:400; text-transform:none; color:var(--text-muted);">(Optional)</span></label>
      <div class="input-wrapper">
        
        <input type="text" id="teacherCode" class="auth-input" placeholder="e.g. TCH001 (Optional)" style="text-transform:uppercase;">
      </div>
    </div>

    <!-- Create Password -->
    <div>
      <label for="password" class="field-label">Create Password</label>
      <div class="input-wrapper">
        
        <input type="password" id="password" class="auth-input" placeholder="At least 6 characters" autocomplete="new-password">
        <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility()" title="Toggle password">Show</button>
      </div>
    </div>
  </div>

  <!-- Legal Consent & KDPA Minor Verification -->
  <div style="margin-top: 14px; padding: 12px 14px; background: rgba(2, 132, 199, 0.06); border: 1px solid rgba(2, 132, 199, 0.2); border-radius: 8px; font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;">
    <label style="display: flex; align-items: flex-start; gap: 9px; cursor: pointer; text-align: left;">
      <input type="checkbox" id="legalConsent" style="margin-top: 3px; accent-color: var(--teal, #0284C7); width: 16px; height: 16px; flex-shrink: 0;" required>
      <span>
        I agree to the <a href="/terms.html" target="_blank" style="color: var(--teal, #0284C7); text-decoration: underline;">Terms of Service</a> and <a href="/privacy.html" target="_blank" style="color: var(--teal, #0284C7); text-decoration: underline;">Privacy Policy</a>. As a student learner, I confirm I have permission from my parent, guardian, or chemistry teacher to use VirtuLab Kenya (KDPA 2019).
      </span>
    </label>
  </div>

  <!-- Submit Registration Button -->
  <button type="button" class="btn-submit-login" onclick="doRegister()">
    <span>Create Student Account</span>
    <span>→</span>
  </button>

  <!-- OAuth Divider -->
  <div class="oauth-divider">
    <span>or sign up with</span>
  </div>

  <div style="display:flex; justify-content:center;">
    <a href="login.html" class="btn-google" style="text-decoration:none; justify-content:center;">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Sign up with Google</span>
    </a>
  </div>

  <!-- Error / Status Feedback Box -->
  <div id="msg"></div>

  <!-- Footer Navigation Links -->
  <div class="auth-footer">
    <p style="margin: 0 0 8px 0;">Already have an account? <a href="login.html">Log in →</a></p>
    <p style="margin: 0;">Are you a teacher? <a href="../teacher/register.html">Teacher Registration</a></p>
  </div>
</div>

<script src="/shared/api.js"></script>
<script src="/shared/page-transitions.js"></script>
<script>
  function setTheme(theme) {
    localStorage.setItem('vlk_theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeButtons();
  }

  function updateThemeButtons() {
    const currentTheme = localStorage.getItem('vlk_theme') || 'dark';
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === currentTheme);
    });
  }
  updateThemeButtons();

  function togglePasswordVisibility() {
    const pwInput = document.getElementById('password');
    if (pwInput.type === 'password') {
      pwInput.type = 'text';
    } else {
      pwInput.type = 'password';
    }
  }

  async function doRegister() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const form = document.getElementById('form').value;
    const schoolCode = document.getElementById('schoolCode').value.trim().toUpperCase();
    const teacherCode = document.getElementById('teacherCode').value.trim().toUpperCase();
    const password = document.getElementById('password').value;
    const legalConsent = document.getElementById('legalConsent');
    const msg = document.getElementById('msg');
    msg.innerHTML = '';

    if (!name || !email || !form || !schoolCode || !password) {
      msg.innerHTML = '<div class="msg-alert err">⚠️ Please fill in all required registration fields.</div>';
      return;
    }
    if (password.length < 6) {
      msg.innerHTML = '<div class="msg-alert err">⚠️ Password must be at least 6 characters long.</div>';
      return;
    }
    if (!legalConsent || !legalConsent.checked) {
      msg.innerHTML = '<div class="msg-alert err">⚠️ Please agree to the Terms of Service &amp; Privacy Policy and confirm parental/teacher permission to continue.</div>';
      return;
    }
    try {
      msg.innerHTML = '<div class="msg-alert info">⚗️ Creating your student account…</div>';
      await Auth.studentRegister(name, email, password, form, schoolCode, teacherCode || undefined);
      msg.innerHTML = '<div class="msg-alert info">🎉 Account created successfully! Redirecting to login…</div>';
      setTimeout(() => window.location.href = 'login.html', 1500);
    } catch (err) {
      msg.innerHTML = '<div class="msg-alert err">' + (err.message || 'Registration failed. Please check your school code and try again.') + '</div>';
    }
  }

  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doRegister();
  });
</script>
</body>
</html>
