name: VirtuLab Kenya CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Validate Service Worker Cache Version & Asset Sync
        working-directory: ./server
        run: node scripts/bump_version.js --dry-run --sync-html

      - name: Prepare test environment (.env)
        working-directory: ./server
        run: cp .env.example .env

      - name: Execute Unit Test Suite (no database required)
        working-directory: ./server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/virtulab_test
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_32chars_minimum
          ADMIN_EMAIL: admin@virtulab.co.ke
          ADMIN_PASSWORD_HASH: $2b$10$/7LKjURiipL1GKB1kGpRs.jilU05AAuNZe2H6TM9tapOdsfGGfWJu
        run: npm test

  docker-build:
    name: Build & Validate Docker Container
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: virtulabkenya:latest

  deploy:
    name: Trigger Cloud Production Deployment
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Webhook (if configured)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering zero-downtime production deployment on Render..."
            curl -sS -X POST "$RENDER_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured. Skipping webhook trigger (Render automatically deploys on push)."
          fi
